# Optional: run the same checks as CI on every commit.
#   pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: validate
        name: validate library
        entry: python scripts/validate.py
        language: python
        additional_dependencies: [jsonschema==4.23.0]
        pass_filenames: false
        always_run: true
