<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architectural hotspots</title>
<style>
  /* CodeScene theme colours. The pastel fills match the app's Code Health bubbles; the -ink variants keep
     numbers and labels readable on white, and fall back to the pastels on dark backgrounds. */
  :root {
    --unhealthy: #ef8290;
    --problematic: #f6d991;
    --healthy: #8ddec8;
    --unhealthy-ink: #c8475a;
    --problematic-ink: #9a7213;
    --healthy-ink: #1f8569;
    --primary: #2f7b7a;
    --navy: #0f2d57;
    --address-tint: #ef829026;
    --plan-tint: #8ddec826;
    --brand-tint: #2f7b7a14;
    --page: #eef2f8;
    --bg: #ffffff;
    --text: #323a4e;
    --text-2: #4f5866;
    --text-3: #7d8694;
    --stroke-2: #d5dbe3;
    --stroke-3: #eceff4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --unhealthy-ink: #ef8290;
      --problematic-ink: #f6d991;
      --healthy-ink: #8ddec8;
      --primary: #62d5de;
      --page: #0a1424;
      --bg: #12223a;
      --text: #eceef1;
      --text-2: #b4bac2;
      --text-3: #848b95;
      --stroke-2: #2e3d52;
      --stroke-3: #1d2a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
  section { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 10px; padding: 20px 24px;
    box-shadow: 0 1px 2px rgba(15, 45, 87, 0.06), 0 2px 8px rgba(15, 45, 87, 0.05); }
  /* The header follows the app's navy-to-teal sidebar. */
  section.hero { background: linear-gradient(120deg, #0f2d57 0%, #0b3a5e 55%, #075062 100%); color: #ffffff; gap: 12px; padding: 28px 24px; }
  section.hero .eyebrow { color: #62d5de; }
  section.hero .intro { background: rgba(255, 255, 255, 0.07); border-left-color: #62d5de; color: #dfe8f2; }
  section.hero .intro strong { color: #62d5de; }
  h1 { font-size: 24px; margin: 0; line-height: 1.25; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .eyebrow { color: var(--primary); font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; }
  .small { font-size: 12px; }
  .secondary { color: var(--text-2); }
  .tertiary { color: var(--text-3); }
  .intro { background: var(--brand-tint); border-left: 3px solid var(--primary); border-radius: 4px; padding: 12px 16px; }
  .intro strong { color: var(--primary); display: block; margin-bottom: 4px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .legend .dot { width: 10px; height: 10px; border-radius: 5px; display: inline-block; }
  .legend .key { color: var(--text); font-weight: 600; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart svg text { font-family: inherit; }
  .bubble { cursor: pointer; }
  .chart:focus { outline: none; }
  .tooltip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--stroke-2); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); padding: 8px 12px; min-width: 240px; z-index: 1; font-size: 11px; line-height: 17px; display: none; }
  .tooltip .name { font-size: 12px; font-weight: 700; }
  .tooltip .quadrant { font-weight: 600; margin-bottom: 6px; color: var(--text-3); }
  .tooltip .row { display: flex; justify-content: space-between; gap: 16px; }
  .tooltip .row span:first-child { color: var(--text-2); }
  .tooltip .row span:last-child { text-align: right; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--stroke-2); border-radius: 6px; overflow: hidden; font-size: 12px; }
  th { background: var(--address-tint); color: var(--text-2); font-size: 11px; font-weight: 600; text-align: left; padding: 6px 12px; }
  td { padding: 8px 12px; border-top: 1px solid var(--stroke-3); color: var(--text-2); overflow-wrap: anywhere; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { color: var(--text); font-weight: 600; }
  .strong { font-weight: 600; }
  .cards { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .cards.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  table.outcomes th { background: var(--brand-tint); }
  .card { border: 1px solid var(--stroke-2); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card.featured { border-color: var(--primary); background: var(--brand-tint); }
  .card .scope { font-size: 13px; font-weight: 700; }
  .card.featured .scope { color: var(--primary); }
  .metric { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .metric span:first-child { font-size: 12px; color: var(--text-2); }
  .metric span:last-child { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quadrants { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; font-size: 12px; }
  .quadrants strong { display: block; }
  .error { border: 1px solid var(--unhealthy-ink); border-radius: 6px; padding: 12px 16px; color: var(--unhealthy-ink); }
  @media (max-width: 720px) {
    .cards, .cards.pair, .quadrants { grid-template-columns: minmax(0, 1fr); }
    .table-wrap { overflow-x: auto; }
    section, section.hero { padding: 16px; }
  }
  @media print {
    main { max-width: none; padding: 0; }
    section { break-inside: avoid; box-shadow: none; }
    body { background: #ffffff; }
  }
</style>
</head>
<body>
<main id="report"></main>

<!-- {{REPORT_DATA}}: replace the placeholder object with ReportData JSON that validates against report-data.schema.json.
     Keep everything outside this block unchanged. -->
<script type="application/json" id="report-data">
{
  "project": { "name": "{{project-name}}", "source": "{{source}}" },
  "components": [],
  "outcomes": []
}
</script>
<!-- {{/REPORT_DATA}} -->

<script>
// ---------------------------------------------------------------------------
// Generic layout below: no project-specific values.
// ---------------------------------------------------------------------------
(function () {
  const root = document.getElementById("report");
  let report;
  try {
    report = JSON.parse(document.getElementById("report-data").textContent);
  } catch (e) {
    root.innerHTML = `<p class="error">The report data is not valid JSON: ${escapeHtml(e.message)}</p>`;
    return;
  }
  if (!report.components || report.components.length === 0) {
    root.innerHTML = `<p class="error">The report has no components. Fill the {{REPORT_DATA}} block with data from CodeScene.</p>`;
    return;
  }

  const { project, components } = report;
  const outcomes = report.outcomes || [];
  const healthyThreshold = 9;
  const unhealthyThreshold = 4;
  const optimal = 10;
  const css = { unhealthy: "var(--unhealthy-ink)", good: "var(--healthy-ink)", primary: "var(--primary)" };

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  }

  // CodeScene's three Code Health classes: unhealthy below 4.0, problematic below 9.0, healthy from 9.0.
  const healthClass = (health) => (health >= healthyThreshold ? "healthy" : health >= unhealthyThreshold ? "problematic" : "unhealthy");
  const dotColour = (health) => `var(--${healthClass(health)}-ink)`;
  const fillColour = (health) => `var(--${healthClass(health)})`;
  const formatInt = (n) => Math.round(n).toLocaleString("en-US");

  // -------------------------------------------------------------------------
  // Trend: the component's averageCodeHealth.trend (direction and pace)
  // -------------------------------------------------------------------------

  const trendOf = (c) => (c.trend && c.trend.direction) || "steady";
  const trendColour = { improving: css.good, declining: css.unhealthy, steady: "" };
  const trendText = (c) => {
    const trend = trendOf(c);
    if (trend === "steady") return c.trend ? "Steady" : "Not enough history";
    return `${trend === "improving" ? "▲ Improving" : "▼ Declining"}${c.trend && c.trend.pace ? `, ${c.trend.pace}` : ""}`;
  };
  const trendGlyph = { length: 24, gap: 5, maxRise: 14 };

  function trendSegment(cx, cy, r, c) {
    const magnitude = c.trend && c.trend.pace === "fast" ? trendGlyph.maxRise : trendGlyph.maxRise / 2;
    const rise = trendOf(c) === "improving" ? magnitude : -magnitude;
    const x2 = cx - r - trendGlyph.gap;
    return { x1: x2 - trendGlyph.length, y1: cy + rise / 2, x2, y2: cy - rise / 2 };
  }

  // -------------------------------------------------------------------------
  // Quadrant model (Gartner PAID: impact = change activity, risk = low Code Health)
  // -------------------------------------------------------------------------

  const quadrants = {
    address: { name: "Address", action: "Prioritized uplift",
      description: "Unhealthy components where much of the development happens. The debt taxes most delivery work, so plan architectural refactoring here first." },
    plan: { name: "Plan", action: "Maintain",
      description: "Healthy, busy components. Guard them with Code Health quality gates so debt doesn't creep in." },
    delay: { name: "Delay", action: "Monitor", description: "Unhealthy but stable components. Revisit if development shifts there." },
    ignore: { name: "Ignore", action: "No action", description: "Healthy and quiet components. Leave them as they are." },
  };

  // Head/tail breaks (Jiang): change activity is heavy-tailed, so split at the mean. The components above it,
  // the head, carry most of the development; the long tail below it is quiet.
  const activityThreshold = components.reduce((sum, c) => sum + c.changes, 0) / components.length;
  const head = components.filter((c) => c.changes > activityThreshold);
  const headShare = head.reduce((sum, c) => sum + c.changes, 0) / (components.reduce((sum, c) => sum + c.changes, 0) || 1);

  function quadrantOf({ changes, health }) {
    const active = changes > activityThreshold;
    const healthy = health >= healthyThreshold;
    if (active) return healthy ? "plan" : "address";
    return healthy ? "ignore" : "delay";
  }

  // -------------------------------------------------------------------------
  // Chart geometry
  // -------------------------------------------------------------------------

  const width = 900;
  const height = 520;
  const margin = { left: 60, right: 24, top: 20, bottom: 56 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;

  const minChanges = Math.max(1, Math.min(...components.map((c) => c.changes)));
  const xMin = Math.pow(10, Math.floor(Math.log10(minChanges / 1.5)));
  const xMax = Math.pow(10, Math.ceil(Math.log10(Math.max(...components.map((c) => c.changes), 1) * 1.5)));
  // Always keep at least one point of Code Health below Healthy, so the Address and Delay areas stay visible
  // even when every component is healthy.
  const yMin = Math.min(Math.floor(Math.min(...components.map((c) => c.health)) - 0.5), healthyThreshold - 1);
  const yMax = optimal;

  const xTicks = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000].filter((t) => t >= xMin && t <= xMax);
  const yTicks = Array.from({ length: Math.round((yMax - yMin) * 2) + 1 }, (_, i) => yMin + i * 0.5);

  const xScale = (changes) =>
    margin.left + ((Math.log10(Math.max(changes, xMin)) - Math.log10(xMin)) / (Math.log10(xMax) - Math.log10(xMin))) * plotWidth;
  const yScale = (health) => margin.top + ((yMax - health) / (yMax - yMin)) * plotHeight;

  const largestComponent = Math.max(...components.map((c) => c.linesOfCode), 1);
  const bubbleRadius = (linesOfCode) => 6 + Math.sqrt(linesOfCode / largestComponent) * 14;

  const diamondPath = (cx, cy, r) => `M ${cx} ${cy - r} L ${cx + r} ${cy} L ${cx} ${cy + r} L ${cx - r} ${cy} Z`;

  const overlaps = (a, b) => a.x1 < b.x2 && b.x1 < a.x2 && a.y1 < b.y2 && b.y1 < a.y2;

  // -------------------------------------------------------------------------
  // Grouping: bubbles that would overlap are merged into one numbered group, within a quadrant only,
  // so a group never mixes quadrants. Outliers stay single.
  // -------------------------------------------------------------------------

  const clusterGap = 3;
  const maxGroupRadius = 30;

  function clusterPoints(points) {
    let clusters = points.map((p) => ({ ...p, members: [p], quadrant: quadrantOf(p) }));
    for (;;) {
      let pair = null;
      for (let i = 0; i < clusters.length && !pair; i++) {
        for (let j = i + 1; j < clusters.length && !pair; j++) {
          const a = clusters[i];
          const b = clusters[j];
          if (a.quadrant === b.quadrant && Math.hypot(a.cx - b.cx, a.cy - b.cy) < a.r + b.r + clusterGap) pair = [i, j];
        }
      }
      if (!pair) return clusters;
      const [a, b] = pair.map((i) => clusters[i]);
      clusters = clusters.filter((_, i) => !pair.includes(i));
      clusters.push(groupOf([...a.members, ...b.members], a.quadrant));
    }
  }

  function groupOf(members, quadrant) {
    const linesOfCode = members.reduce((sum, m) => sum + m.linesOfCode, 0);
    const weighted = (key) => members.reduce((sum, m) => sum + m[key] * m.linesOfCode, 0) / (linesOfCode || 1);
    return {
      members: [...members].sort((x, y) => x.health - y.health),
      quadrant,
      name: `${members.length} components`,
      health: weighted("health"),
      linesOfCode,
      cx: weighted("cx"),
      cy: weighted("cy"),
      r: Math.min(maxGroupRadius, bubbleRadius(linesOfCode)),
    };
  }

  const isGroup = (c) => c.members.length > 1;

  // The members of an expanded group, spread on a ring around it and kept inside the plot.
  function fanOut(group) {
    const maxR = Math.max(...group.members.map((m) => m.r));
    const n = group.members.length;
    const ring = Math.max(group.r + maxR + 18, (n * (2 * maxR + 8)) / (2 * Math.PI));
    return group.members.map((m, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
      const cx = Math.min(width - margin.right - m.r, Math.max(margin.left + m.r, group.cx + ring * Math.cos(angle)));
      const cy = Math.min(height - margin.bottom - m.r, Math.max(margin.top + m.r, group.cy + ring * Math.sin(angle)));
      const cos = Math.cos(angle);
      const label = {
        x: cx + Math.cos(angle) * (m.r + 4),
        y: cy + Math.sin(angle) * (m.r + 4) + 4,
        anchor: cos > 0.3 ? "start" : cos < -0.3 ? "end" : "middle",
      };
      return { ...m, cx, cy, label };
    });
  }

  function placeLabels(points) {
    const obstacles = points.map((p) => {
      const trendWidth = trendOf(p) === "steady" ? 0 : trendGlyph.gap + trendGlyph.length;
      const halfHeight = trendOf(p) === "steady" ? p.r : Math.max(p.r, trendGlyph.maxRise / 2);
      return { x1: p.cx - p.r - trendWidth, y1: p.cy - halfHeight, x2: p.cx + p.r, y2: p.cy + halfHeight };
    });
    // The quadrant names and actions in the four plot corners.
    const left = margin.left;
    const right = width - margin.right;
    const bottom = height - margin.bottom;
    const titleBoxes = [
      { x1: left, y1: margin.top, x2: left + 110, y2: margin.top + 40 },
      { x1: right - 110, y1: margin.top, x2: right, y2: margin.top + 40 },
      { x1: left, y1: bottom - 40, x2: left + 110, y2: bottom },
      { x1: right - 110, y1: bottom - 40, x2: right, y2: bottom },
    ];
    const placed = [...titleBoxes];
    return points.map((p, index) => {
      // Groups carry their count; only groups that need action get a text label too.
      if (isGroup(p) && p.quadrant !== "address") return { ...p, label: null };
      const w = p.name.length * 6.4;
      const h = 13;
      const d = p.r * 0.7 + 4;
      const candidates = [
        { x: p.cx + p.r + 5, y: p.cy + 4, anchor: "start" },
        { x: p.cx - p.r - 5, y: p.cy + 4, anchor: "end" },
        { x: p.cx, y: p.cy - p.r - 6, anchor: "middle" },
        { x: p.cx, y: p.cy + p.r + 14, anchor: "middle" },
        { x: p.cx + d, y: p.cy - d - 2, anchor: "start" },
        { x: p.cx + d, y: p.cy + d + 10, anchor: "start" },
        { x: p.cx - d, y: p.cy - d - 2, anchor: "end" },
        { x: p.cx - d, y: p.cy + d + 10, anchor: "end" },
      ];
      const boxOf = (c) => {
        const x1 = c.anchor === "start" ? c.x : c.anchor === "end" ? c.x - w : c.x - w / 2;
        return { x1, y1: c.y - h + 3, x2: x1 + w, y2: c.y + 3 };
      };
      const inside = (b) => b.x1 >= margin.left && b.x2 <= width - margin.right && b.y1 >= margin.top;
      const own = obstacles[index];
      const fits = candidates.find((c) => {
        const b = boxOf(c);
        return inside(b) && !placed.some((o) => overlaps(o, b)) && !obstacles.some((o) => o !== own && overlaps(o, b));
      });
      // When nothing fits, leave the label off rather than overprint; the hover card still names it.
      // Address components and groups are always labelled.
      if (!fits && p.quadrant !== "address") return { ...p, label: null };
      const choice = fits || candidates[0];
      placed.push(boxOf(choice));
      return { ...p, label: choice };
    });
  }

  // -------------------------------------------------------------------------
  // Sections
  // -------------------------------------------------------------------------

  const clusters = placeLabels(
    clusterPoints(
      [...components]
        .sort((a, b) => b.linesOfCode - a.linesOfCode)
        .map((c) => ({ ...c, cx: xScale(c.changes), cy: yScale(c.health), r: bubbleRadius(c.linesOfCode) })),
    ).sort((a, b) => b.linesOfCode - a.linesOfCode),
  );
  const groupCount = clusters.filter(isGroup).length;

  function markSvg(c, key, dimmed) {
    const opacity = dimmed ? 0.2 : 1;
    const address = c.quadrant === "address";
    const shape = address
      ? `<circle class="ring" cx="${c.cx}" cy="${c.cy}" r="${c.r + 7}" fill="var(--bg)" fill-opacity="0.85" stroke="var(--navy)" stroke-opacity="0.35"/>
         <path class="mark" d="${diamondPath(c.cx, c.cy, c.r)}" fill="var(--unhealthy)" stroke="var(--navy)" stroke-width="1.5"/>`
      : `<circle class="mark" cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="${fillColour(c.health)}" fill-opacity="0.9" stroke="var(--bg)" stroke-width="1.5"/>`;
    const count = isGroup(c)
      ? `<text pointer-events="none" x="${c.cx}" y="${c.cy + 4.5}" text-anchor="middle" font-size="${Math.min(14, Math.max(10, c.r * 0.8))}"
           font-weight="700" fill="#0f2d57">${c.members.length}</text>`
      : "";
    return `<g class="bubble${isGroup(c) ? " group" : ""}" data-key="${key}" opacity="${opacity}">${shape}${count}</g>`;
  }

  function labelSvg(c, dimmed) {
    if (!c.label) return "";
    const address = c.quadrant === "address";
    return `<text pointer-events="none" x="${c.label.x}" y="${c.label.y}" text-anchor="${c.label.anchor}" font-size="11" opacity="${dimmed ? 0.2 : 1}"
      font-weight="${address ? 600 : 400}" fill="${address ? "var(--text)" : "var(--text-2)"}">${escapeHtml(c.name)}</text>`;
  }

  function trendSvg(c, dimmed) {
    if (isGroup(c) || trendOf(c) === "steady") return "";
    const s = trendSegment(c.cx, c.cy, c.r, c);
    const colour = trendColour[trendOf(c)];
    return `<g pointer-events="none" opacity="${dimmed ? 0.2 : 1}">
      <line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="var(--bg)" stroke-width="6" stroke-linecap="round"/>
      <line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${colour}" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${s.x1}" cy="${s.y1}" r="2.5" fill="var(--bg)" stroke="${colour}" stroke-width="1.5"/></g>`;
  }

  // Renders the chart with at most one group expanded. Returns the shown items by key, for the hover cards.
  function quadrantChartSvg(expanded) {
    const splitX = xScale(activityThreshold);
    const splitY = yScale(healthyThreshold);
    const left = margin.left;
    const right = margin.left + plotWidth;
    const top = margin.top;
    const bottom = margin.top + plotHeight;

    const regions = [
      { id: "ignore", x: left, y: top, w: splitX - left, h: splitY - top, anchor: "start" },
      { id: "plan", x: splitX, y: top, w: right - splitX, h: splitY - top, anchor: "end" },
      { id: "delay", x: left, y: splitY, w: splitX - left, h: bottom - splitY, anchor: "start" },
      { id: "address", x: splitX, y: splitY, w: right - splitX, h: bottom - splitY, anchor: "end" },
    ];

    const regionSvg = regions.map((r) => {
      const fill = r.id === "address" ? "var(--address-tint)" : r.id === "plan" ? "var(--plan-tint)" : "transparent";
      const nameColour = r.id === "address" ? css.unhealthy : r.id === "plan" ? css.good : "var(--text-2)";
      const tx = r.anchor === "start" ? r.x + 10 : r.x + r.w - 10;
      const lower = r.id === "delay" || r.id === "address";
      return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}"/>
        <text x="${tx}" y="${lower ? r.y + r.h - 26 : r.y + 20}" text-anchor="${r.anchor}" font-size="14" font-weight="700" letter-spacing="0.5" fill="${nameColour}">${quadrants[r.id].name.toUpperCase()}</text>
        <text x="${tx}" y="${lower ? r.y + r.h - 10 : r.y + 36}" text-anchor="${r.anchor}" font-size="12" fill="var(--text-3)">${quadrants[r.id].action}</text>
        ${r.id === "address" && !components.some((c) => quadrantOf(c) === "address")
          ? `<text x="${r.x + r.w / 2}" y="${r.y + r.h / 2 - 2}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--healthy-ink)">✓ Nothing to address</text>
             <text x="${r.x + r.w / 2}" y="${r.y + r.h / 2 + 15}" text-anchor="middle" font-size="12" fill="var(--text-3)">No busy part of the architecture is below ${healthyThreshold.toFixed(1)}</text>`
          : ""}`;
    }).join("");

    const gridSvg =
      yTicks.map((t) => `<line x1="${left}" x2="${right}" y1="${yScale(t)}" y2="${yScale(t)}" stroke="var(--stroke-3)"/>
        <text x="${left - 8}" y="${yScale(t) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${t.toFixed(1)}</text>`).join("") +
      xTicks.map((t) => `<line x1="${xScale(t)}" x2="${xScale(t)}" y1="${top}" y2="${bottom}" stroke="var(--stroke-3)"/>
        <text x="${xScale(t)}" y="${bottom + 16}" text-anchor="middle" font-size="11" fill="var(--text-3)">${t}</text>`).join("");

    const splitsSvg = `<line x1="${splitX}" x2="${splitX}" y1="${top}" y2="${bottom}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 4"/>
      <line x1="${left}" x2="${right}" y1="${splitY}" y2="${splitY}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="${left}" y="${top}" width="${plotWidth}" height="${plotHeight}" fill="none" stroke="var(--stroke-2)"/>`;

    const items = {};
    const others = clusters.map((c, i) => {
      items[`c${i}`] = c;
      const dimmed = expanded !== null && expanded !== i;
      return { trend: trendSvg(c, dimmed), mark: markSvg(c, `c${i}`, dimmed), label: expanded === i ? "" : labelSvg(c, dimmed) };
    });

    let fanSvg = "";
    if (expanded !== null) {
      const group = clusters[expanded];
      const spread = fanOut(group);
      const leaders = spread.map((m) => `<line x1="${group.cx}" y1="${group.cy}" x2="${m.cx}" y2="${m.cy}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="2 3"/>`).join("");
      const marks = spread.map((m, j) => {
        items[`m${j}`] = { ...m, quadrant: group.quadrant };
        return markSvg({ ...m, members: [m], quadrant: group.quadrant }, `m${j}`, false);
      }).join("");
      const labels = spread.map((m) => labelSvg({ ...m, quadrant: group.quadrant }, false)).join("");
      fanSvg = `<g pointer-events="none">${leaders}</g>${marks}${labels}`;
    }

    const axesSvg = `<text x="${left + plotWidth / 2}" y="${height - 12}" text-anchor="middle" font-size="12" fill="var(--text-2)">Change activity: commits to the component's files (log scale) → more relevant</text>
      <text x="16" y="${top + plotHeight / 2}" text-anchor="middle" font-size="12" fill="var(--text-2)" transform="rotate(-90 16 ${top + plotHeight / 2})">Average Code Health (1–10) → healthier</text>`;

    const svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Components by change activity and Code Health">
      ${regionSvg}${gridSvg}${splitsSvg}
      ${others.map((o) => o.trend).join("")}${others.map((o) => o.mark).join("")}${others.map((o) => o.label).join("")}
      ${fanSvg}${axesSvg}
    </svg>`;
    return { svg, items };
  }

  function renderChart(chart, expanded) {
    const { svg, items } = quadrantChartSvg(expanded);
    chart.innerHTML = `${svg}<div class="tooltip" role="tooltip"></div>`;
    const tooltip = chart.querySelector(".tooltip");
    chart.querySelectorAll(".bubble").forEach((bubble) => {
      const key = bubble.dataset.key;
      const c = items[key];
      const mark = bubble.querySelector(".mark");
      const ring = bubble.querySelector(".ring");
      bubble.addEventListener("mouseenter", () => {
        if (bubble.getAttribute("opacity") !== "1") return;
        mark.setAttribute("stroke", "var(--text)");
        mark.setAttribute("fill-opacity", "1");
        if (ring) ring.setAttribute("stroke-opacity", "1");
        tooltip.innerHTML = key.startsWith("c") && isGroup(c) ? groupTooltipHtml(c, Number(key.slice(1)) === expanded) : tooltipHtml(c);
        const below = c.cy - c.r < 140;
        tooltip.style.left = `${(c.cx / width) * 100}%`;
        tooltip.style.top = `${(c.cy / height) * 100}%`;
        tooltip.style.transform = below ? `translate(-50%, ${c.r + 14}px)` : `translate(-50%, calc(-100% - ${c.r + 14}px))`;
        tooltip.style.display = "block";
      });
      bubble.addEventListener("mouseleave", () => {
        mark.setAttribute("stroke", c.quadrant === "address" ? "var(--navy)" : "var(--bg)");
        mark.setAttribute("fill-opacity", "0.85");
        if (ring) ring.setAttribute("stroke-opacity", "0.35");
        tooltip.style.display = "none";
      });
      if (key.startsWith("c") && isGroup(c)) {
        bubble.addEventListener("click", (event) => {
          event.stopPropagation();
          const index = Number(key.slice(1));
          renderChart(chart, expanded === index ? null : index);
          chart.focus({ preventScroll: true });
        });
      }
    });
    // Clicking anywhere else, or Escape, collapses an expanded group.
    chart.querySelector("svg").addEventListener("click", () => {
      if (expanded !== null) renderChart(chart, null);
    });
    chart.onkeydown = (event) => {
      if (event.key === "Escape" && expanded !== null) renderChart(chart, null);
    };
  }

  function groupTooltipHtml(g, isExpanded) {
    const shown = g.members.slice(0, 10);
    const q = quadrants[g.quadrant];
    return `<div class="name">${g.members.length} components</div>
      <div class="quadrant" style="${g.quadrant === "address" ? `color:${css.unhealthy}` : ""}">${q.name} · ${q.action}</div>
      ${shown.map((m) => `<div class="row"><span>${escapeHtml(m.name)}</span>
        <span style="color:${dotColour(m.health)};font-weight:600">${m.health.toFixed(2)} · ${m.changes} commits</span></div>`).join("")}
      ${g.members.length > shown.length ? `<div class="row"><span>and ${g.members.length - shown.length} more</span><span></span></div>` : ""}
      <div class="quadrant" style="margin:6px 0 0">${isExpanded ? "Click to collapse" : "Click to spread them out"}</div>`;
  }

  function tooltipHtml(c) {
    const rows = [
      ["Code Health", c.health.toFixed(2), dotColour(c.health)],
      ["12-month trend", trendText(c), trendColour[trendOf(c)] || undefined],
      ["Hotspot Code Health", c.hotspotHealth === null ? "—" : c.hotspotHealth.toFixed(2), c.hotspotHealth === null ? undefined : dotColour(c.hotspotHealth)],
      ["Commits", String(c.changes)],
      ["Size", `${formatInt(c.linesOfCode)} lines in ${c.files} files`],
      ["Hotspots", String(c.hotspots)],
    ];
    if (c.worstFile) rows.push(["Worst file", `${c.worstFile.path} (${c.worstFile.health.toFixed(2)})`, dotColour(c.worstFile.health)]);
    const q = quadrants[quadrantOf(c)];
    return `<div class="name">${escapeHtml(c.name)}</div>
      <div class="quadrant" style="${quadrantOf(c) === "address" ? `color:${css.unhealthy}` : ""}">${q.name} · ${q.action}</div>
      ${rows.map(([label, value, colour]) => `<div class="row"><span>${label}</span>
        <span style="color:${colour || "var(--text)"};font-weight:${colour ? 600 : 400}">${escapeHtml(value)}</span></div>`).join("")}`;
  }

  function legend() {
    const items = [
      [`Unhealthy (below ${unhealthyThreshold.toFixed(1)})`, fillColour(unhealthyThreshold - 1)],
      [`Problematic (below ${healthyThreshold.toFixed(1)})`, fillColour(healthyThreshold - 1)],
      [`Healthy (${healthyThreshold.toFixed(1)} or higher)`, fillColour(healthyThreshold)],
    ];
    const trendLine = (colour, rise) =>
      `<svg width="22" height="14" viewBox="0 0 22 14"><line x1="3" y1="${7 + rise / 2}" x2="19" y2="${7 - rise / 2}" stroke="${colour}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    return `<div class="legend">
      <span class="key"><svg width="16" height="16" viewBox="0 0 16 16"><path d="${diamondPath(8, 8, 6)}" fill="var(--unhealthy)" stroke="var(--navy)" stroke-width="1.2"/></svg>Architectural hotspot to address</span>
      ${items.map(([label, colour]) => `<span><i class="dot" style="background:${colour}"></i>${label}</span>`).join("")}
      <span>12-month trend: ${trendLine(css.good, 8)} Improving ${trendLine(css.unhealthy, -8)} Declining</span>
      <span class="tertiary">Bubble size: lines of code</span></div>`;
  }

  function addressTable(items) {
    const diamond = `<svg width="12" height="12" viewBox="0 0 12 12"><path d="${diamondPath(6, 6, 5)}" fill="var(--unhealthy)" stroke="var(--navy)" stroke-width="1"/></svg>`;
    const rows = items.map((c) => `<tr>
      <td>${diamond}</td>
      <td class="name">${escapeHtml(c.name)}</td>
      <td class="num strong" style="color:${dotColour(c.health)}">${c.health.toFixed(2)}</td>
      <td class="num strong" style="color:${trendColour[trendOf(c)] || "var(--text-3)"}">${trendText(c)}</td>
      <td class="num" style="color:${c.hotspotHealth === null ? "var(--text-3)" : dotColour(c.hotspotHealth)}">${c.hotspotHealth === null ? "—" : c.hotspotHealth.toFixed(2)}</td>
      <td class="num">${c.changes}</td>
      <td class="num">${c.hotspots}</td>
      <td>${c.worstFile ? `${escapeHtml(c.worstFile.path)} <span class="strong" style="color:${dotColour(c.worstFile.health)}">${c.worstFile.health.toFixed(2)}</span>` : "—"}</td>
    </tr>`).join("");
    return `<div class="table-wrap"><table>
      <thead><tr><th></th><th>Component</th><th class="num">Code Health</th><th class="num">12-mo trend</th><th class="num">Hotspot CH</th><th class="num">Commits</th><th class="num">Hotspots</th><th>Worst file</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  const signedPercent = (value) => `${value > 0 ? "+" : "−"}${Math.abs(value).toFixed(0)}`;
  const midpointPercent = ({ lower, upper }) => `${signedPercent((lower + upper) / 2)}%`;

  function card(scope, subtitle, metrics, featured, valueColour) {
    return `<div class="card${featured ? " featured" : ""}">
      <div><div class="scope">${escapeHtml(scope)}</div><div class="small secondary">${subtitle}</div></div>
      ${metrics.map(([label, value]) => `<div class="metric"><span>${label}</span><span style="color:${valueColour}">${value}</span></div>`).join("")}
    </div>`;
  }

  function outcomesSection(addressNames) {
    const target = outcomes[0].target;
    const cards = outcomes.map((o, i) => card(
      o.scope,
      `Code Health <span class="strong" style="color:${dotColour(o.baseline)}">${o.baseline.toFixed(2)}</span> → <span class="strong" style="color:${dotColour(o.target)}">${o.target.toFixed(2)}</span>`,
      [["Defects", midpointPercent(o.defects)], ["Development time", midpointPercent(o.developmentTime)], ["Productivity", midpointPercent(o.productivity)]],
      i === 0,
      css.good,
    )).join("");
    const componentTarget = (outcomes.find((o, i) => i > 0) || outcomes[0]).target;
    return `<section>
      <h2>What uplifting ${addressNames.length <= 3 ? addressNames.map(escapeHtml).join(" and ") : `the ${addressNames.length} Address components`} to ${componentTarget.toFixed(1)} buys</h2>
      <div class="cards">${cards}</div>
      <p class="small tertiary">Estimated change: the midpoint of the CodeScene outcome model's 90% interval. Component cards: development inside that component.
        Whole codebase: the lines-of-code-weighted average across all components shown (${outcomes[0].baseline.toFixed(2)} → ${target.toFixed(2)}),
        with the Address components at ${componentTarget.toFixed(1)} and everything else unchanged.</p>
    </section>`;
  }

  const team = report.team || { developers: 10, hoursPerWeek: 40, weeksPerYear: 46 };
  const hoursPerDeveloper = team.hoursPerWeek * team.weeksPerYear;
  const teamHours = team.developers * hoursPerDeveloper;
  const totalChanges = components.reduce((sum, c) => sum + c.changes, 0);

  function workShare(scope) {
    const component = components.find((c) => c.name === scope);
    return component ? component.changes / totalChanges : 1;
  }

  function hoursSaved(outcome) {
    const productivityGain = (outcome.productivity.lower + outcome.productivity.upper) / 2 / 100;
    return teamHours * workShare(outcome.scope) * (productivityGain / (1 + productivityGain));
  }

  function roiSection() {
    const cards = outcomes.map((o, i) => {
      const saved = hoursSaved(o);
      const share = workShare(o.scope);
      return card(
        o.scope,
        share === 1 ? "All of the team's development time" : `${Math.round(share * 100)}% of the team's commits`,
        [
          ["Hours saved per year", formatInt(Math.round(saved / 10) * 10)],
          ["Full-time developers freed", (saved / hoursPerDeveloper).toFixed(1)],
          ["Per developer per week", `${(saved / team.developers / team.weeksPerYear).toFixed(1)} h`],
        ],
        i === 0,
        css.primary,
      );
    }).join("");
    return `<section>
      <h2>ROI for a team of ${team.developers} developers</h2>
      <div class="cards">${cards}</div>
      <p class="small tertiary">Assumes ${team.developers} developers at ${team.hoursPerWeek} hours a week for ${team.weeksPerYear} weeks a year
        (${formatInt(teamHours)} team hours). A productivity gain p means the same work takes 1/(1 + p) of the time, using the midpoint
        estimates above. Component cards count only the time spent in that component, approximated by its share of commits.
        The component cards add up to roughly the whole-codebase figure.</p>
    </section>`;
  }

  // Many Address components: one card pair for the whole codebase, and a table row per component instead of cards.
  const maxComponentCards = 3;

  function condensedOutcomesSection(addressCount) {
    const [whole, ...perComponent] = outcomes;
    const componentTarget = (perComponent[0] || whole).target;
    const saved = hoursSaved(whole);
    const wholeOutcome = card(
      whole.scope,
      `Code Health <span class="strong" style="color:${dotColour(whole.baseline)}">${whole.baseline.toFixed(2)}</span> → <span class="strong" style="color:${dotColour(whole.target)}">${whole.target.toFixed(2)}</span>`,
      [["Defects", midpointPercent(whole.defects)], ["Development time", midpointPercent(whole.developmentTime)], ["Productivity", midpointPercent(whole.productivity)]],
      true,
      css.good,
    );
    const wholeRoi = card(
      `ROI for a team of ${team.developers} developers`,
      "All of the team's development time",
      [
        ["Hours saved per year", formatInt(Math.round(saved / 10) * 10)],
        ["Full-time developers freed", (saved / hoursPerDeveloper).toFixed(1)],
        ["Per developer per week", `${(saved / team.developers / team.weeksPerYear).toFixed(1)} h`],
      ],
      true,
      css.primary,
    );
    const rows = perComponent.map((o) => {
      const componentSaved = hoursSaved(o);
      return `<tr>
        <td class="name">${escapeHtml(o.scope)}</td>
        <td class="num"><span class="strong" style="color:${dotColour(o.baseline)}">${o.baseline.toFixed(2)}</span> → <span class="strong" style="color:${dotColour(o.target)}">${o.target.toFixed(1)}</span></td>
        <td class="num strong" style="color:${css.good}">${midpointPercent(o.defects)}</td>
        <td class="num strong" style="color:${css.good}">${midpointPercent(o.developmentTime)}</td>
        <td class="num strong" style="color:${css.good}">${midpointPercent(o.productivity)}</td>
        <td class="num">${Math.round(workShare(o.scope) * 100)}%</td>
        <td class="num strong" style="color:${css.primary}">${formatInt(Math.round(componentSaved / 10) * 10)}</td>
        <td class="num">${(componentSaved / hoursPerDeveloper).toFixed(1)}</td>
      </tr>`;
    }).join("");
    return `<section>
      <h2>What uplifting the ${addressCount} Address components to ${componentTarget.toFixed(1)} buys</h2>
      <div class="cards pair">${wholeOutcome}${wholeRoi}</div>
      <div class="table-wrap"><table class="outcomes">
        <thead><tr><th>Component</th><th class="num">Code Health</th><th class="num">Defects</th><th class="num">Dev time</th><th class="num">Productivity</th>
          <th class="num">Share of commits</th><th class="num">Hours saved / year</th><th class="num">Developers freed</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <p class="small tertiary">Estimated change: the midpoint of the CodeScene outcome model's 90% interval. Rows: development inside that component.
        Whole codebase: the lines-of-code-weighted average across all components shown, with the Address components at ${componentTarget.toFixed(1)}
        and everything else unchanged. Assumes ${team.developers} developers at ${team.hoursPerWeek} hours a week for ${team.weeksPerYear} weeks a year
        (${formatInt(teamHours)} team hours). A productivity gain p means the same work takes 1/(1 + p) of the time. A component's share of the
        team's time is approximated by its share of commits.</p>
    </section>`;
  }

  // -------------------------------------------------------------------------
  // Page
  // -------------------------------------------------------------------------

  const byQuadrant = (id) => components.filter((c) => quadrantOf(c) === id);
  const address = byQuadrant("address").sort((a, b) => b.changes - a.changes);
  const order = ["address", "plan", "delay", "ignore"];
  const addressShare = totalChanges ? Math.round((address.reduce((sum, c) => sum + c.changes, 0) / totalChanges) * 100) : 0;
  document.title = `Architectural hotspots · ${project.name}`;
  root.innerHTML = `
    <section class="hero">
      <div class="eyebrow">CodeScene · Architectural debt</div>
      <h1>Architectural hotspots: where to pay down technical debt</h1>
      <div class="intro"><strong>The idea</strong>Code Health per architectural component shows where the technical debt sits.
        Change activity across a component's files shows how much of the team's work runs through it. Together they show which parts
        of the architecture are worth uplifting, and which debt can safely wait.</div>
    </section>

    <section>
      ${legend()}
      <div class="chart" tabindex="-1"></div>
      <p class="small tertiary">One bubble per architectural component in ${escapeHtml(project.name)}.${groupCount
        ? ` Components that would overlap within the same quadrant are grouped into one bubble; the number is how many it holds.
          Hover a group to list them, click it to spread them out, and click again or press Escape to collapse it.`
        : ""} Vertical split: head/tail breaks at the
        mean change activity (${Math.round(activityThreshold)} commits); the ${head.length} of ${components.length} components above it carry
        ${Math.round(headShare * 100)}% of all commits. Horizontal split: Healthy (${healthyThreshold.toFixed(1)}). The line left of a bubble shows
        the direction of the component's Code Health trend, steeper when the pace is fast; steady components have no line. Hover a bubble
        for details. Quadrants follow Gartner's PAID model, with change activity as impact and low Code Health as risk.
        Source: ${escapeHtml(project.source)}.</p>
    </section>

    <section>
      <h2>Address first</h2>
      ${address.length
        ? `<p class="small secondary">${address.length} ${address.length === 1 ? "component carries" : "components carry"} ${addressShare}% of all commits while scoring below ${healthyThreshold.toFixed(1)}.</p>${addressTable(address)}`
        : `<p class="small secondary">No component is both busy and below ${healthyThreshold.toFixed(1)}.</p>`}
    </section>

    ${outcomes.length > maxComponentCards + 1
      ? condensedOutcomesSection(address.length)
      : outcomes.length ? outcomesSection(address.map((c) => c.name)) + roiSection() : ""}

    <section>
      <h2>The four quadrants</h2>
      <div class="quadrants">${order.map((id) => `<div><strong>${quadrants[id].name} · ${quadrants[id].action} (${byQuadrant(id).length})</strong>
        <span class="secondary">${quadrants[id].description}</span></div>`).join("")}</div>
    </section>`;

  renderChart(root.querySelector(".chart"), null);
})();
</script>
</body>
</html>
