<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refactoring targets</title>
<style>
  /* CodeScene theme colours. The pastel fills match the app's Code Health bubbles; the -ink variants keep
     numbers and labels readable on white, and fall back to the pastels on dark backgrounds. */
  :root {
    --unhealthy: #ef8290;
    --problematic: #f6d991;
    --healthy: #8ddec8;
    --unhealthy-ink: #c8475a;
    --problematic-ink: #9a7213;
    --healthy-ink: #1f8569;
    --primary: #2f7b7a;
    --navy: #0f2d57;
    --address-tint: #ef829026;
    --plan-tint: #8ddec826;
    --brand-tint: #2f7b7a14;
    --page: #eef2f8;
    --bg: #ffffff;
    --text: #323a4e;
    --text-2: #4f5866;
    --text-3: #7d8694;
    --stroke-2: #d5dbe3;
    --stroke-3: #eceff4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --unhealthy-ink: #ef8290;
      --problematic-ink: #f6d991;
      --healthy-ink: #8ddec8;
      --primary: #62d5de;
      --page: #0a1424;
      --bg: #12223a;
      --text: #eceef1;
      --text-2: #b4bac2;
      --text-3: #848b95;
      --stroke-2: #2e3d52;
      --stroke-3: #1d2a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
  section { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 10px; padding: 20px 24px;
    box-shadow: 0 1px 2px rgba(15, 45, 87, 0.06), 0 2px 8px rgba(15, 45, 87, 0.05); }
  /* The header follows the app's navy-to-teal sidebar. */
  section.hero { background: linear-gradient(120deg, #0f2d57 0%, #0b3a5e 55%, #075062 100%); color: #ffffff; gap: 12px; padding: 28px 24px; }
  section.hero .eyebrow { color: #62d5de; }
  section.hero .intro { background: rgba(255, 255, 255, 0.07); border-left-color: #62d5de; color: #dfe8f2; }
  section.hero .intro strong { color: #62d5de; }
  h1 { font-size: 24px; margin: 0; line-height: 1.25; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .eyebrow { color: var(--primary); font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; }
  .small { font-size: 12px; }
  .secondary { color: var(--text-2); }
  .tertiary { color: var(--text-3); }
  .intro { background: var(--brand-tint); border-left: 3px solid var(--primary); border-radius: 4px; padding: 12px 16px; }
  .intro strong { color: var(--primary); display: block; margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .kpi .value .of { font-size: 14px; font-weight: 600; color: var(--text-3); }
  .kpi { border: 1px solid var(--stroke-2); border-radius: 6px; padding: 12px 14px; }
  .kpi .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--navy); }
  .kpi .label { font-size: 12px; color: var(--text-2); }
  .kpi .detail { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--stroke-2); border-radius: 6px; overflow: hidden; font-size: 12px; }
  th { background: var(--brand-tint); color: var(--text-2); font-size: 11px; font-weight: 600; text-align: left; padding: 6px 10px; }
  td { padding: 8px 10px; border-top: 1px solid var(--stroke-3); color: var(--text-2); overflow-wrap: anywhere; vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .strong { font-weight: 600; }
  td .file { color: var(--text); font-weight: 600; }
  td.file-cell { min-width: 180px; overflow-wrap: break-word; }
  td.flags-cell { min-width: 130px; }
  td.author-cell { min-width: 110px; overflow-wrap: normal; }
  .table-wrap { overflow-x: auto; }
  a.file { text-decoration: none; }
  a.file:hover { text-decoration: underline; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; border-radius: 10px;
    padding: 1px 8px; white-space: nowrap; }
  .badge.primary { background: var(--navy); color: #ffffff; }
  .badge.secondary { background: var(--brand-tint); color: var(--primary); border: 1px solid var(--primary); }
  .badge.local { background: var(--stroke-3); color: var(--text-2); }
  .flag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin: 0 4px 4px 0; white-space: nowrap; }
  .flag.declining { background: var(--address-tint); color: var(--unhealthy-ink); }
  .flag.knowledge { background: #f6d99140; color: var(--problematic-ink); }
  .flag.safety { background: var(--stroke-3); color: var(--text-2); }
  .target { border: 1px solid var(--stroke-2); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .target-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .target-head .rank { font-size: 20px; font-weight: 700; color: var(--navy); min-width: 28px; }
  .target-head .title { font-size: 16px; font-weight: 700; color: var(--text); }
  .path { font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .fact .label { font-size: 11px; color: var(--text-3); }
  .fact .value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .block h3 { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 6px; }
  .block ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .block li { margin-bottom: 4px; }
  .block li .where { color: var(--text-3); font-size: 12px; }
  .outcome { display: flex; gap: 24px; flex-wrap: wrap; background: var(--plan-tint); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--text-2); }
  .outcome strong { display: block; font-size: 18px; color: var(--healthy-ink); font-variant-numeric: tabular-nums; }
  .spec-btn { font: inherit; font-size: 11px; font-weight: 600; color: var(--primary); background: var(--brand-tint); border: 1px solid var(--primary);
    border-radius: 4px; padding: 2px 8px; margin-top: 4px; cursor: pointer; white-space: nowrap; }
  .spec-btn:hover { background: var(--primary); color: #ffffff; }
  .target-head .spec-btn { margin: 0 0 0 auto; font-size: 12px; padding: 4px 10px; }
  dialog.spec { width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: none; border-radius: 10px; padding: 0;
    background: var(--bg); color: var(--text); box-shadow: 0 12px 40px rgba(15, 45, 87, 0.35); }
  dialog.spec::backdrop { background: rgba(15, 45, 87, 0.45); }
  .spec-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--stroke-2); }
  .spec-head h2 { flex: 1; font-size: 15px; }
  .spec-head button { font: inherit; font-size: 12px; font-weight: 600; border-radius: 4px; padding: 5px 12px; cursor: pointer;
    border: 1px solid var(--primary); background: var(--bg); color: var(--primary); }
  .spec-head button.primary-action { background: var(--primary); color: #ffffff; }
  .spec-intro { padding: 10px 18px 0; font-size: 12px; color: var(--text-2); }
  .spec pre { margin: 12px 18px 18px; padding: 14px 16px; background: var(--page); border-radius: 6px; overflow: auto; max-height: calc(100vh - 220px);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; color: var(--text); }
  .muted-box { background: var(--stroke-3); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--text-2); }
  .error { border: 1px solid var(--unhealthy-ink); border-radius: 6px; padding: 12px 16px; color: var(--unhealthy-ink); }
  .empty { text-align: center; padding: 24px; color: var(--healthy-ink); font-weight: 600; }
  @media (max-width: 720px) {
    .kpis, .facts, .columns { grid-template-columns: minmax(0, 1fr); }
    .table-wrap { overflow-x: auto; }
    section, section.hero { padding: 16px; }
  }
  @media print {
    main { max-width: none; padding: 0; }
    section, .target { break-inside: avoid; box-shadow: none; }
    body { background: #ffffff; }
  }
</style>
</head>
<body>
<main id="report"></main>

<!-- {{REPORT_DATA}}: replace the placeholder object with ReportData JSON that validates against report-data.schema.json.
     Keep everything outside this block unchanged. -->
<script type="application/json" id="report-data">
{
  "project": { "name": "{{project-name}}", "source": "{{source}}" },
  "targetHealth": 9,
  "targets": []
}
</script>
<!-- {{/REPORT_DATA}} -->

<script>
// ---------------------------------------------------------------------------
// Generic layout below: no project-specific values.
// ---------------------------------------------------------------------------
(function () {
  const root = document.getElementById("report");

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  }

  let report;
  try {
    report = JSON.parse(document.getElementById("report-data").textContent);
  } catch (e) {
    root.innerHTML = `<p class="error">The report data is not valid JSON: ${escapeHtml(e.message)}</p>`;
    return;
  }

  const { project, targets } = report;
  const targetHealth = report.targetHealth || 9;
  const healthyThreshold = 9;
  const unhealthyThreshold = 4;
  const thinCoverage = 0.5;

  // CodeScene's three Code Health classes: unhealthy below 4.0, problematic below 9.0, healthy from 9.0.
  const healthClass = (health) => (health >= healthyThreshold ? "healthy" : health >= unhealthyThreshold ? "problematic" : "unhealthy");
  const inkColour = (health) => `var(--${healthClass(health)}-ink)`;
  const fillColour = (health) => `var(--${healthClass(health)})`;
  const formatInt = (n) => Math.round(n).toLocaleString("en-US");
  const fileName = (path) => path.split("/").pop();
  const midpoint = ({ lower, upper }) => (lower + upper) / 2;
  const signedPercent = (value) => `${value > 0 ? "+" : "−"}${Math.abs(value).toFixed(0)}%`;
  const typeLabel = { primary: "Primary", secondary: "Secondary", local: "Local" };

  // -------------------------------------------------------------------------
  // Risks: derived from the data, never added by hand
  // -------------------------------------------------------------------------

  const isDeclining = (t) => t.trend && t.trend.direction === "declining";
  const hasKnowledgeRisk = (t) => t.offboardingRisk === true || (t.owner && t.owner.isActive === false);
  const hasThinSafetyNet = (t) => t.coverage === null || t.coverage === undefined || t.coverage < thinCoverage;

  function flags(t) {
    const out = [];
    if (isDeclining(t)) out.push(`<span class="flag declining">▼ Declining${t.trend.pace === "fast" ? ", fast" : ""}</span>`);
    if (hasKnowledgeRisk(t)) out.push(`<span class="flag knowledge">Knowledge risk</span>`);
    if (hasThinSafetyNet(t)) out.push(`<span class="flag safety">Needs tests first</span>`);
    return out.join("");
  }

  function sparkline(t) {
    const series = (t.healthSeries || []).filter((p) => typeof p.value === "number");
    if (series.length < 2) return "";
    const w = 96;
    const h = 28;
    const x = (i) => 3 + (i / (series.length - 1)) * (w - 6);
    const y = (v) => 3 + ((10 - v) / 9) * (h - 6);
    const points = series.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
    const last = series[series.length - 1];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Code Health from ${series[0].value} to ${last.value}">
      <line x1="0" x2="${w}" y1="${y(healthyThreshold)}" y2="${y(healthyThreshold)}" stroke="var(--healthy-ink)" stroke-dasharray="2 3" stroke-width="1"/>
      <polyline points="${points}" fill="none" stroke="var(--text-3)" stroke-width="1.5"/>
      <circle cx="${x(series.length - 1)}" cy="${y(last.value)}" r="3.5" fill="${fillColour(last.value)}" stroke="var(--navy)" stroke-width="1"/>
    </svg>`;
  }

  // -------------------------------------------------------------------------
  // Sections
  // -------------------------------------------------------------------------

  function summary() {
    const byType = (type) => targets.filter((t) => t.type === type).length;
    const typeDetail = ["primary", "secondary", "local"].filter(byType).map((type) => `${byType(type)} ${type}`).join(" · ");
    const kpis = [
      [String(targets.length), "Refactoring targets", typeDetail],
      [formatInt(targets.reduce((sum, t) => sum + t.changes, 0)), "Commits to these files", "how often the team pays the tax"],
      [formatInt(targets.reduce((sum, t) => sum + t.linesOfCode, 0)), "Lines of code", "the size of the refactoring"],
      [`${targets.filter(hasThinSafetyNet).length} <span class="of">of ${targets.length}</span>`, "Need tests first",
        `line coverage below ${Math.round(thinCoverage * 100)}% or unknown`],
      [`${targets.filter(hasKnowledgeRisk).length} <span class="of">of ${targets.length}</span>`, "Knowledge risk",
        "main author inactive, or the knowledge would leave with them"],
    ];
    return `<div class="kpis">${kpis.map(([value, label, detail]) => `<div class="kpi"><div class="value">${value}</div>
      <div class="label">${label}</div><div class="detail">${detail}</div></div>`).join("")}</div>`;
  }

  function backlogTable() {
    const rows = targets.map((t, i) => `<tr>
      <td class="num strong">${i + 1}</td>
      <td class="file-cell"><a class="file" href="#target-${i + 1}" style="color:var(--text)">${escapeHtml(fileName(t.path))}</a>
        <div class="small tertiary">${escapeHtml(t.component || "")}</div>
        ${hasSpec(t) ? `<button class="spec-btn" data-spec="${i}">Refactoring spec</button>` : ""}</td>
      <td><span class="badge ${t.type}">${typeLabel[t.type]}</span></td>
      <td class="num strong" style="color:${inkColour(t.health)}">${t.health.toFixed(2)}</td>
      <td class="num">${formatInt(t.changes)}</td>
      <td class="num">${formatInt(t.linesOfCode)}</td>
      <td class="author-cell">${t.owner ? `${escapeHtml(t.owner.name)}${t.owner.isActive ? "" : ' <span class="tertiary">(inactive)</span>'}` : "—"}</td>
      <td class="flags-cell">${flags(t)}</td>
    </tr>`).join("");
    return `<div class="table-wrap"><table>
      <thead><tr><th class="num">#</th><th>File</th><th>Target</th><th class="num">Code Health</th><th class="num">Commits</th>
        <th class="num">Lines</th><th>Main author</th><th>Plan for</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  function targetCard(t, i) {
    const facts = [
      ["Code Health", `<span style="color:${inkColour(t.health)}">${t.health.toFixed(2)}</span>`, sparkline(t)],
      ["Commits", formatInt(t.changes), ""],
      ["Lines of code", formatInt(t.linesOfCode), ""],
      ["Line coverage", t.coverage === null || t.coverage === undefined ? "Unknown" : `${Math.round(t.coverage * 100)}%`, ""],
      ["Main author", t.owner ? `${escapeHtml(t.owner.name)}` : "—",
        t.owner ? `<div class="small tertiary">${Math.round(t.owner.ownership * 100)}% of the code${t.owner.isActive ? "" : ", inactive"}</div>` : ""],
    ];
    const start = (t.startHere || []).map((s) => `<li><strong>${escapeHtml(s.target)}</strong>
      <span class="where">${evidenceText(s)}${s.issues && s.issues.length ? ` · ${s.issues.map(escapeHtml).join(", ")}` : ""}</span></li>`).join("");
    const findings = (t.findings || []).map((f) => `<li>${escapeHtml(f.name)}
      ${f.location && f.location.symbol ? `<span class="where">in ${escapeHtml(f.location.symbol)}${f.location.startLine ? `, lines ${f.location.startLine}–${f.location.endLine}` : ""}</span>` : ""}</li>`).join("");
    const coupled = (t.coupledFiles || []).map((c) => `<li>${escapeHtml(fileName(c.path))} <span class="where">${c.couplingPercent}% of commits</span></li>`).join("");
    const startBlock = start
      ? `<ul>${start}</ul>`
      : `<p class="small tertiary">${escapeHtml(t.startHereMessage || "No function-level recommendations.")}</p>`;
    const findingsBlock = t.reviewError
      ? `<p class="small tertiary">CodeScene's file review was unavailable for this file. ${escapeHtml(t.reviewError)}</p>`
      : findings ? `<ul>${findings}</ul>` : t.findings ? '<p class="small tertiary">No issues reported.</p>' : '<p class="small tertiary">Not reviewed; local targets get the prioritized refactorings only.</p>';
    const review = `<div class="columns">
        <div class="block"><h3>Start here</h3>${startBlock}</div>
        <div class="block"><h3>Code Health issues</h3>${findingsBlock}</div>
      </div>`;
    const outcome = t.outcome
      ? `<div class="outcome"><div>If refactored to Code Health ${targetHealth.toFixed(1)}:</div>
          <div><strong>${signedPercent(midpoint(t.outcome.defects))}</strong>defects</div>
          <div><strong>${signedPercent(midpoint(t.outcome.developmentTime))}</strong>development time</div>
          <div><strong>${signedPercent(midpoint(t.outcome.productivity))}</strong>productivity</div></div>`
      : "";
    return `<div class="target" id="target-${i + 1}">
      <div class="target-head"><span class="rank">${i + 1}</span><span class="title">${escapeHtml(fileName(t.path))}</span>
        <span class="badge ${t.type}">${typeLabel[t.type]} target</span>${t.isHotspot ? '<span class="badge local">Hotspot</span>' : ""}
        <span>${flags(t)}</span>${hasSpec(t) ? `<button class="spec-btn" data-spec="${i}">Refactoring spec</button>` : ""}</div>
      <div class="path">${escapeHtml(t.path)}${t.component ? ` · component ${escapeHtml(t.component)}` : ""}</div>
      <div class="facts">${facts.map(([label, value, extra]) => `<div class="fact"><div class="label">${label}</div><div class="value">${value}</div>${extra}</div>`).join("")}</div>
      ${review}
      ${coupled ? `<div class="block"><h3>Changes together with</h3><ul>${coupled}</ul></div>` : ""}
      ${outcome}
    </div>`;
  }

  // -------------------------------------------------------------------------
  // Refactoring spec: a Markdown brief for a coding agent, built only from the report data
  // -------------------------------------------------------------------------

  const hasSpec = (t) => t.type === "primary" || t.type === "secondary";

  function evidenceText(s) {
    const parts = [];
    if (s.loc) parts.push(`${s.loc} lines`);
    if (s.cyclomaticComplexity) parts.push(`complexity ${s.cyclomaticComplexity}`);
    if (s.revisions) parts.push(`changed in ${s.revisions} commits`);
    return parts.join(", ");
  }

  const trendWords = (t) =>
    !t.trend || t.trend.direction === "steady" ? "steady" : `${t.trend.direction}${t.trend.pace ? ` (${t.trend.pace})` : ""}`;

  function buildSpec(t) {
    const name = fileName(t.path);
    const lines = [];
    const push = (...xs) => lines.push(...xs);
    const where = (f) => f.location && f.location.symbol
      ? ` in \`${f.location.symbol}\`${f.location.startLine ? ` (lines ${f.location.startLine}–${f.location.endLine})` : ""}` : "";

    push(`# Refactoring spec: ${name}`, "",
      `- File: \`${t.path}\``);
    if (t.component) push(`- Component: ${t.component}`);
    push(`- Source: ${project.source}${report.analysisDate ? `, analysis of ${report.analysisDate}` : ""}. Check that the functions and line numbers below still match the code.`, "");

    push("## Goal", "",
      `Raise the Code Health of \`${name}\` from ${t.health.toFixed(2)} to ${targetHealth.toFixed(1)} or higher, without changing its behaviour.`,
      `CodeScene ranks it as a ${t.type} uplift target: it was changed in ${t.changes} commits, it has ${formatInt(t.linesOfCode)} lines of code, and its Code Health trend is ${trendWords(t)}.`);
    if (t.outcome) {
      push(`CodeScene's outcome model estimates ${signedPercent(midpoint(t.outcome.defects))} defects and ${signedPercent(midpoint(t.outcome.developmentTime))} development time for future work in this file at Code Health ${targetHealth.toFixed(1)}.`);
    }
    push("");

    push("## Refactor these functions, in this order", "");
    if (t.startHere && t.startHere.length) {
      t.startHere.forEach((s, k) => {
        push(`### ${k + 1}. \`${s.target}\``, "");
        if (s.issues && s.issues.length) push(`- Code Health issues: ${s.issues.join(", ")}`);
        const evidence = evidenceText(s);
        if (evidence) push(`- Evidence: ${evidence}${typeof s.defects === "number" ? `, ${s.defects} defects` : ""}`);
        if (s.text) push(`- Why: ${s.text}`);
        (t.findings || []).filter((f) => f.location && f.location.symbol === s.target).forEach((f) => {
          push(`- ${f.name}${f.location.startLine ? ` (lines ${f.location.startLine}–${f.location.endLine})` : ""}${f.recommendation ? `: ${f.recommendation}` : ""}`);
        });
        push("");
      });
    } else {
      push(`CodeScene had no prioritized refactorings for this file${t.startHereMessage ? ` (${t.startHereMessage})` : ""}. Start with a fresh review of the file (see *How to work*) and use its findings instead.`, "");
    }

    const listed = new Set((t.startHere || []).map((s) => s.target));
    const others = (t.findings || []).filter((f) => !(f.location && listed.has(f.location.symbol)));
    if (others.length) {
      push("## Other Code Health issues in the file", "");
      others.forEach((f) => push(`- **${f.name}**${where(f)}${f.recommendation ? `: ${f.recommendation}` : ""}`));
      push("");
    } else if (t.reviewError) {
      push("## Other Code Health issues in the file", "",
        "CodeScene's file review was unavailable when this spec was made, so the per-issue guidance is missing. Get it with a fresh review (see *How to work*).", "");
    }

    push("## Before you change anything", "");
    if (hasThinSafetyNet(t)) {
      push(`- Line coverage is ${t.coverage === null || t.coverage === undefined ? "unknown" : `${Math.round(t.coverage * 100)}%`}. Add characterization tests around the functions above first, so the refactoring provably keeps the behaviour.`);
    } else {
      push(`- Line coverage is ${Math.round(t.coverage * 100)}%. Run the tests before you start, so you know they pass.`);
    }
    (t.coupledFiles || []).forEach((c) => push(`- \`${fileName(c.path)}\` changes together with this file in ${c.couplingPercent}% of its commits. Check whether it needs the same change: \`${c.path}\``));
    if (t.owner) {
      push(t.owner.isActive
        ? `- ${t.owner.name} wrote ${Math.round(t.owner.ownership * 100)}% of the code. Ask them to review the plan and the changes.`
        : `- The main author, ${t.owner.name}, is no longer active. Plan extra time to understand the code, and keep each step small.`);
    }
    if (isDeclining(t)) push("- Code Health is declining: avoid adding features to these functions while the refactoring is in progress.");
    push("");

    push("## Constraints", "",
      "- Preserve behaviour. The tests must pass before and after every step.",
      "- Keep the public API and exported names unchanged.",
      "- One refactoring per commit, so each step can be reviewed and reverted on its own.",
      "- Don't reformat or change code outside the functions you are refactoring.", "");

    push("## How to work", "",
      `1. Get a fresh view from the CodeScene MCP server: \`list_prioritized_refactorings\` and \`review_analyzed_file\` for \`${t.path}\`${project.id ? ` in project ${project.id}` : ""}. Compare it with this spec; the analysis may have moved on.`,
      "2. Read the functions above and propose a step-by-step plan: which refactoring, in which function, in which order. Wait for approval before changing code.",
      "3. Add the tests from *Before you change anything* first, if any are needed.",
      "4. After each step, run the tests and check the file's Code Health with CodeScene's local Code Health tool (the IDE extension or CLI), which sees uncommitted changes.",
      `5. Stop when the file reaches Code Health ${targetHealth.toFixed(1)}, or when the next step would change behaviour. Report what you changed, the new Code Health, and what is left.`, "");

    push("## Done when", "",
      `- CodeScene reports Code Health ${targetHealth.toFixed(1)} or higher for \`${name}\`.`,
      "- All tests pass and the behaviour is unchanged.");
    if (t.owner && t.owner.isActive) push(`- ${t.owner.name} has reviewed the changes.`);
    return lines.join("\n") + "\n";
  }

  function specDialog() {
    let dialog = document.getElementById("spec-dialog");
    if (dialog) return dialog;
    dialog = document.createElement("dialog");
    dialog.id = "spec-dialog";
    dialog.className = "spec";
    dialog.innerHTML = `<div class="spec-head"><h2></h2>
        <button class="primary-action" data-action="copy">Copy</button>
        <button data-action="download">Download .md</button>
        <button data-action="close" aria-label="Close">✕</button></div>
      <p class="spec-intro">Give this spec to your coding agent. It asks the agent to refresh the data with the CodeScene MCP server,
        propose a plan for approval, and check Code Health after every step.</p>
      <pre></pre>`;
    document.body.appendChild(dialog);
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
      const action = event.target.dataset && event.target.dataset.action;
      const text = dialog.querySelector("pre").textContent;
      if (action === "close") dialog.close();
      if (action === "copy") {
        const done = () => { event.target.textContent = "Copied"; setTimeout(() => (event.target.textContent = "Copy"), 1500); };
        const fallback = () => { selectSpec(dialog); event.target.textContent = "Selected: press Ctrl/⌘+C"; setTimeout(() => (event.target.textContent = "Copy"), 3000); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      }
      if (action === "download") {
        const url = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = dialog.dataset.filename;
        a.click();
        URL.revokeObjectURL(url);
      }
    });
    return dialog;
  }

  // Clipboard access can be blocked in some viewers; select the text so the user can copy it by hand.
  function selectSpec(dialog) {
    const range = document.createRange();
    range.selectNodeContents(dialog.querySelector("pre"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function openSpec(t) {
    const dialog = specDialog();
    dialog.querySelector("h2").textContent = `Refactoring spec: ${fileName(t.path)}`;
    dialog.querySelector("pre").textContent = buildSpec(t);
    dialog.dataset.filename = `refactoring-spec-${fileName(t.path).replace(/[^A-Za-z0-9._-]+/g, "-")}.md`;
    dialog.showModal();
  }

  function peopleTable() {
    const byOwner = new Map();
    targets.forEach((t, i) => {
      const key = t.owner ? t.owner.name : "Unknown";
      if (!byOwner.has(key)) byOwner.set(key, { owner: t.owner, items: [] });
      byOwner.get(key).items.push({ t, rank: i + 1 });
    });
    const rows = [...byOwner.values()]
      .sort((a, b) => b.items.reduce((s, x) => s + x.t.changes, 0) - a.items.reduce((s, x) => s + x.t.changes, 0))
      .map(({ owner, items }) => `<tr>
        <td><span class="file">${escapeHtml(owner ? owner.name : "Unknown")}</span></td>
        <td>${owner ? (owner.isActive ? "Active" : '<span style="color:var(--unhealthy-ink)" class="strong">Inactive</span>') : "—"}</td>
        <td>${items.map(({ t, rank }) => `<a class="file" href="#target-${rank}" style="color:var(--text-2)">#${rank} ${escapeHtml(fileName(t.path))}</a>`).join(", ")}</td>
        <td class="num">${formatInt(items.reduce((s, x) => s + x.t.changes, 0))}</td>
      </tr>`).join("");
    return `<div class="table-wrap"><table>
      <thead><tr><th>Main author</th><th>Status</th><th>Targets</th><th class="num">Commits</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  // -------------------------------------------------------------------------
  // Page
  // -------------------------------------------------------------------------

  document.title = `Refactoring targets · ${project.name}`;
  const failedReviews = targets.filter((t) => t.reviewError).length;

  root.innerHTML = `
    <section class="hero">
      <div class="eyebrow">CodeScene · Refactoring targets · ${escapeHtml(project.name)}</div>
      <h1>Refactoring targets: where refactoring pays off first</h1>
      <div class="intro"><strong>The idea</strong>CodeScene's uplift targets are unhealthy files that the team changes often.
        Refactoring them pays back in everyday delivery, because that is where the team pays the cost of complex code.
        This report turns them into a backlog: why each file, where to start, who to involve and what it buys.</div>
    </section>

    ${targets.length === 0
      ? `<section><p class="empty">✓ No uplift targets in ${escapeHtml(project.name)}</p>
          <p class="small secondary" style="text-align:center">No unhealthy code is changed often enough for CodeScene to recommend refactoring it.</p></section>`
      : `<section>
          <h2>Summary</h2>
          ${summary()}
        </section>

        <section>
          <h2>Refactoring backlog</h2>
          <p class="small secondary">In CodeScene's priority order: primary and secondary targets matter most in the whole project, local
            targets most within their component. Within each, the most-changed file comes first.${report.omitted ? ` ${report.omitted} more ${report.omitted === 1 ? "target was" : "targets were"} left out to keep the plan short.` : ""}</p>
          ${backlogTable()}
        </section>

        <section>
          <h2>The targets</h2>
          ${targets.map(targetCard).join("")}
        </section>

        <section>
          <h2>Who to involve</h2>
          <p class="small secondary">The main author of each target knows the code best. Pair them with whoever does the refactoring;
            where the author is inactive, plan time to rebuild that knowledge.</p>
          ${peopleTable()}
        </section>`}

    <section>
      <h2>How to read this report</h2>
      <p class="small secondary"><strong>Plan for</strong>: <em>Declining</em> means Code Health is getting worse, so the cost grows the longer
        it waits. <em>Knowledge risk</em> means most of the code was written by people who have left, or would leave with its main author.
        <em>Needs tests first</em> means line coverage is below ${Math.round(thinCoverage * 100)}% or unknown: add tests around the code
        before refactoring it.</p>
      <p class="small secondary"><strong>Outcomes</strong> are the midpoint of the 90% interval from CodeScene's outcome model for
        raising a file's Code Health to ${targetHealth.toFixed(1)}, and apply to development inside that file.</p>
      <p class="small secondary"><strong>Refactoring specs</strong>: primary and secondary targets have a spec to hand to a coding agent.
        It is built from this report's data, and asks the agent to refresh it with the CodeScene MCP server, propose a plan for approval,
        and check Code Health after every step.</p>
      ${failedReviews ? `<p class="small secondary"><strong>Reviews</strong>: CodeScene's file review was unavailable for ${failedReviews}
        ${failedReviews === 1 ? "target" : "targets"}; their cards and specs lack the per-issue details, but keep the functions to start with.</p>` : ""}
      <p class="small tertiary">Source: ${escapeHtml(project.source)}.</p>
    </section>`;

  root.addEventListener("click", (event) => {
    const button = event.target.closest(".spec-btn");
    if (button) openSpec(targets[Number(button.dataset.spec)]);
  });
})();
</script>
</body>
</html>
