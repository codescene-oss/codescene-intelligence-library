name: release

# Publishes a release when a maintainer pushes a v* tag. It runs no checks: the validate workflow checks every
# pull request, and branch protection requires it before anything reaches main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Stops if the tag isn't v<catalog.json version>, since a published release can't be renamed.
      - name: Build
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: echo "zip=$(python scripts/build_release.py --tag "$TAG")" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.zip }}

      # Draft first, then publish: with immutable releases on, assets can't be added after publishing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" "$ZIP" "$ZIP.sha256"
          gh release edit "$TAG" --draft=false
